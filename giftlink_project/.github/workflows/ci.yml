name: GiftLink CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            giftlink-backend/package-lock.json
            giftlink-frontend/package-lock.json
      - name: Backend install
        working-directory: giftlink-backend
        run: npm install
      - name: Backend tests
        working-directory: giftlink-backend
        run: npm test
      - name: Frontend install
        working-directory: giftlink-frontend
        run: npm install
      - name: Frontend build
        working-directory: giftlink-frontend
        run: npm run build
