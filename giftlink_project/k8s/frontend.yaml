apiVersion: apps/v1
kind: Deployment
metadata:
  name: giftlink-frontend
  namespace: giftlink
spec:
  replicas: 2
  selector: { matchLabels: { app: giftlink-frontend } }
  template:
    metadata: { labels: { app: giftlink-frontend } }
    spec:
      containers:
        - name: frontend
          image: YOUR_DOCKERHUB_USER/giftlink-frontend:latest
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: giftlink-frontend
  namespace: giftlink
spec:
  type: NodePort
  selector: { app: giftlink-frontend }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
